# SHL-3 — packaging & distribution for the HIOC POS desktop shell.
#
# Signing/notarization are env-var driven placeholders (D7-7): unset, the
# build is unsigned (Windows shows a SmartScreen warning on first run; macOS
# builds cannot be notarized and Gatekeeper will block them on another
# machine). See desktop/README.md for exactly which vars to set, and for the
# release procedure (bump the version below, then run the "POS desktop
# release" GitHub Actions workflow).

appId: in.hioc.pos
productName: HIOC POS
copyright: HIOC

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!**/*.map"

# The `usb` native module's .node binary must live outside the asar archive
# to be dlopen-able at runtime.
asarUnpack:
  - "**/*.node"

# `usb` ships prebuilt N-API binaries per platform (@node-usb/usb-<platform>),
# which are ABI-stable across Electron versions — nothing to recompile, and a
# Windows build made on a Mac could not compile one anyway. The Windows binary
# must be present in node_modules before `dist:win` (the script installs it).
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # Reads CSC_LINK / CSC_KEY_PASSWORD from the environment automatically when
  # present; unsigned otherwise.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Reads CSC_LINK / CSC_KEY_PASSWORD for code signing automatically.
  # Off for the unsigned pilot. With an Apple Developer account, set true and
  # export APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (D7-7).
  notarize: false

dmg:
  sign: false

# Auto-update feed: GitHub Releases on THIS repo (it's public, so counter
# machines need no token to read a release; the app's own source being
# public too is an accepted tradeoff — see desktop/README.md).
#
# `tagNamePrefix: pos-v` keeps this repo's POS desktop releases (tag
# `pos-v<version>`) distinct from any other tag scheme this repo might use,
# and must match the tag the release step below actually creates.
# `releaseType: release` documents that releases here are normal (non-draft),
# so `electron-updater` and a plain download link both see them immediately —
# a draft release would be invisible to both.
#
# electron-builder itself never uploads to GitHub any more — `npm run
# release:win` runs it with `--publish never`, build only. This block still
# matters: it's what makes electron-builder write `release/latest.yml` +
# `.blockmap` and embed `app-update.yml` in the packaged app (it does this
# from the `publish:` config regardless of `--publish`), which
# electron-updater's feed needs. The actual GitHub Release — tag, upload of
# the installer, latest.yml and blockmap — is created afterwards by a
# `gh release create` step, in CI (.github/workflows/pos-desktop-release.yml,
# on workflow_dispatch or a pushed `pos-v*` tag) or by hand locally
# (`gh release create "pos-v$(node -p "require('./package.json').version")"
# release/*.exe release/*.exe.blockmap release/latest.yml`, after `npm run
# release:win`). See desktop/README.md "Releasing" for the full procedure.
publish:
  provider: github
  owner: Prengineerator
  repo: hioc.github.io
  tagNamePrefix: pos-v
  releaseType: release
